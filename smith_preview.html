<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blacksmith Preview</title>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/all.min.css">
    <link rel="stylesheet" href="./assets/css/rpg-awesome.min.css">
    <link rel="stylesheet" href="./assets/css/style.css">
    <style>
        body { background: #0d0d14; }
        #lang-toggle { position: fixed; top: 8px; right: 8px; z-index: 10; }
    </style>
</head>
<body>
    <button id="lang-toggle">EN/JA</button>
    <div class="modal-container" id="defaultModal"></div>

    <script>
        // ===== Preview stubs =====
        const mkItem = (rarity, category, type, lvl, stats, extra = {}) => ({
            uid: "u" + Math.random().toString(36).slice(2, 8),
            rarity, category, type,
            attribute: type === "Weapon" ? "Damage" : "Defense",
            lvl, tier: 4, value: 15000 + Math.floor(Math.random() * 20000),
            stats: stats.map(s => ({ ...s })),
            affixes: [], finalized: false,
            ...extra
        });
        const sword = mkItem("Rare", "Sword", "Weapon", 45, [{ atk: 320 }, { atkSpd: 6.5 }, { vamp: 1.2 }]);
        const axe = mkItem("Epic", "Axe", "Weapon", 62, [{ atk: 540 }, { critRate: 4.5 }, { critDmg: 22 }], { goldTier: 2, goldStats: ["atk", "critRate"] });
        const plate = mkItem("Legendary", "Plate", "Armor", 78, [{ hp: 2400 }, { def: 380 }, { hpPct: 8 }], { lvBase: 70 });
        const helm = mkItem("Uncommon", "Great Helm", "Helmet", 30, [{ def: 120 }, { hp: 300 }]);
        const buckler = mkItem("Heirloom", "Buckler", "Shield", 88, [{ def: 460 }, { thorns: 0.1 }, { dodge: 5 }], { upgLvl: 3 });
        const dagger = mkItem("Common", "Dagger", "Weapon", 12, [{ atk: 60 }, { atkSpd: 9 }]);

        const player = {
            name: "TestHero", gold: 2500000, crystals: 137, crystalWard: false,
            storage: [JSON.stringify(mkItem("Rare", "Mace", "Weapon", 50, [{ atk: 300 }]))],
            storageTier: 0,
            equipped: [sword, axe],
            inventory: { equipment: [JSON.stringify(plate), JSON.stringify(helm), JSON.stringify(buckler), JSON.stringify(dagger)], consumables: [] }
        };
        const dungeon = { settings: { enemyScaling: 1.3 }, progress: { floor: 250 } };
        const defaultModalElement = document.querySelector('#defaultModal');
        const sfxDeny = () => {}, sfxConfirm = () => {}, sfxEquip = () => {}, sfxDecline = () => {},
              sfxOpen = () => {}, sfxSell = () => {}, sfxUnequip = () => {};
        const saveData = () => {}, playerLoadStats = () => {}, addDungeonLog = () => {},
              continueExploring = () => {}, hpValidation = () => {};

        document.querySelector("#lang-toggle").onclick = () => {
            setLang(LANG === "ja" ? "en" : "ja");
            showBlacksmithModal(() => {});
        };
    </script>
    <script src="./assets/js/i18n.js"></script>
    <script src="./assets/js/utility.js"></script>
    <script src="./assets/js/equipment.js"></script>
    <script>window.addEventListener("load", () => showBlacksmithModal(() => {}));</script>
</body>
</html>
